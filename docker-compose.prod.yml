# Production stack: PostgreSQL + app (point Cloudflare Tunnel at app:8080)
services:
  postgres:
    image: postgres:16-alpine
    container_name: lepakmasjid-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lepakmasjid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-lepakmasjid}
    volumes:
      - lepakmasjid_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lepakmasjid} -d ${POSTGRES_DB:-lepakmasjid}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lepakmasjid

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_URL: ${APP_URL:?Set APP_URL in .env.prod}
        VITE_API_URL: /api
    container_name: lepakmasjid-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-lepakmasjid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lepakmasjid}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      PUBLIC_URL: ${APP_URL}
      APP_URL: ${APP_URL}
      UPLOAD_DIR: /app/server/uploads
      STATIC_DIR: /app/dist
      RUN_SEED: ${RUN_SEED:-0}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - lepakmasjid_uploads:/app/server/uploads
    networks:
      - lepakmasjid

volumes:
  lepakmasjid_pg_prod:
  lepakmasjid_uploads:

networks:
  lepakmasjid:
    driver: bridge